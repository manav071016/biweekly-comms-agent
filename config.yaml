  engagement:
    display_name: Engagement (Generosity)
    slack_channel: "#comms-engagement"
    prompt_context: |
      Engagement owns activity-driven retention, generosity/bonus optimization, and churn
      intervention via ML. North-star metrics: bonus ROI, player retention lift from ML
      interventions, churn model precision/recall, campaign take-up rate.
      Audience: VP+ leadership, CRM, Trading, and Data Science.
      Prioritize: experiment results (churn model, bonus optimization), campaign launches,
      pipeline/DE readiness, and any blocker on experiment timelines.
    sources:
      notion:
        - page_id: "7397779c1f0941a59ad2904e903c66a9"
          label: "Activity Bonus Model — Bi-Weekly Stakeholder Updates"
          include_children: true
        - page_id: "313032f852c58031a591fe99c5922366"
          label: "Bonus Optimization Q2 Strategy"
        - page_id: "327032f852c580a295b6cd53613c8c99"
          label: "Large Scale Weekly Generosity Design"
        - page_id: "328032f852c5803fbc15d2c5f5311cf7"
          label: "Activity/Churn Model Working Group"
      jira:
        - project_key: "AM"
          statuses: ["Done", "In Review", "In Progress"]
      gdrive_search_terms:
        - "generosity bonus optimization"
        - "churn retention experiment"
      slack_channels:
        - channel_id: "C0AR3E53MDW"
          label: "#tmp-br-generosity-experiment"
        - channel_id: "C0AJTD0AAKD"
          label: "#applied-ml-bonusing"
        - channel_id: "C0AAC4BPR89"
